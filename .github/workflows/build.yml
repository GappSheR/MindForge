name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci
          npx vite build

      - name: Package game + studio (electron-packager)
        run: |
          npx electron-packager . "MindForge Quiz" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../release --overwrite --no-asar --ignore="^/(site|store|\.github|admin_app|dist_exe|release)(/|$)"
          npx electron-packager . "QuizForge Studio" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../release --overwrite --no-asar --ignore="^/(site|store|\.github|admin_app|dist_exe|release)(/|$)"

      - name: Package admin (separate app)
        working-directory: ./admin_app
        run: |
          npx electron-packager . "MindForge Admin Game" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../../release --overwrite --no-asar --icon=ico/icon_admin.ico

      - name: Rename exes
        shell: pwsh
        run: |
          Get-ChildItem -Path "..\release" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "MindForge Quiz.exe" } | Rename-Item -NewName "MindForge Quiz Made by GappSheRVIP777.exe"
          Get-ChildItem -Path "..\release" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "QuizForge Studio.exe" } | Rename-Item -NewName "QuizForge Studio Made by GappSheRVIP777.exe"
          Get-ChildItem -Path "..\release" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "MindForge Admin Game.exe" } | Rename-Item -NewName "MindForge Admin Game Made by GappSheRVIP777.exe"

      - name: Pack zips
        shell: pwsh
        working-directory: ../release
        run: |
          Compress-Archive -Path "MindForge Quiz*\*" -DestinationPath "MindForge Quiz.zip" -Force
          Compress-Archive -Path "QuizForge Studio*\*" -DestinationPath "QuizForge Studio.zip" -Force
          Compress-Archive -Path "MindForge Admin Game*\*" -DestinationPath "MindForge Admin Game.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ../release/*.zip
          generate_release_notes: true