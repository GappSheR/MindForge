name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci
          npx vite build

      - name: Package game + studio (electron-packager)
        run: |
          npx electron-packager . "MindForge Quiz" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../release --overwrite --no-asar
          npx electron-packager . "QuizForge Studio" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../release --overwrite --no-asar

      - name: Package admin (separate app)
        working-directory: ./admin_app
        run: |
          npx electron-packager . "MindForge Admin Game" --platform=win32 --arch=x64 --electron-version=43.2.0 --out=../../release --overwrite --no-asar --icon=ico/icon_admin.ico

      - name: Rename exes
        shell: pwsh
        run: |
          Rename-Item "..\release\MindForge Quiz\MindForge Quiz.exe" "MindForge Quiz Made by GappSheRVIP777.exe"
          Rename-Item "..\release\QuizForge Studio\QuizForge Studio.exe" "QuizForge Studio Made by GappSheRVIP777.exe"
          Rename-Item "..\release\MindForge Admin Game\MindForge Admin Game.exe" "MindForge Admin Game Made by GappSheRVIP777.exe"

      - name: Pack zips
        shell: pwsh
        working-directory: ../release
        run: |
          Compress-Archive -Path "MindForge Quiz\*" -DestinationPath "MindForge Quiz.zip" -Force
          Compress-Archive -Path "QuizForge Studio\*" -DestinationPath "QuizForge Studio.zip" -Force
          Compress-Archive -Path "MindForge Admin Game\*" -DestinationPath "MindForge Admin Game.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ../release/*.zip
          generate_release_notes: true

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment